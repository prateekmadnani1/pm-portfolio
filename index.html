/* ---------- Tokens. Line colours are --l1…--l5 (and --on1…--on5 for text on them). ---------- */
:root{
  --bg:#E9EEF1; --card:#FFFFFF; --ink:#0D1B26; --mute:#53646F; --rule:#D2DBE0; --soft:#F2F5F7;
  --l1:#D63A22; --on1:#FFFFFF;
  --l2:#00857E; --on2:#FFFFFF;
  --l3:#5B3FCB; --on3:#FFFFFF;
  --l4:#EBA000; --on4:#1B1400;
  --l5:#1F63D6; --on5:#FFFFFF;
  --font:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1016; --card:#121A21; --ink:#E8EEF1; --mute:#8FA1AC; --rule:#24313A; --soft:#1A242C;
    --l1:#FF6B52; --on1:#1A0905;
    --l2:#27C7BD; --on2:#04201E;
    --l3:#A08EFF; --on3:#140C3B;
    --l4:#FFC233; --on4:#1B1400;
    --l5:#6EA8FF; --on5:#06142E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1016; --card:#121A21; --ink:#E8EEF1; --mute:#8FA1AC; --rule:#24313A; --soft:#1A242C;
  --l1:#FF6B52; --on1:#1A0905;
  --l2:#27C7BD; --on2:#04201E;
  --l3:#A08EFF; --on3:#140C3B;
  --l4:#FFC233; --on4:#1B1400;
  --l5:#6EA8FF; --on5:#06142E;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
@media (min-width:760px){.wrap{padding-inline:28px;padding-block:28px 48px}}

/* ---------- Header: the name as a station sign ---------- */
.top{display:grid;gap:14px;margin-bottom:20px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.plate{display:flex;align-items:stretch;background:var(--ink);color:var(--bg);border-radius:10px;overflow:hidden;min-width:0}
.stripes{display:grid;width:clamp(14px,2vw,26px);flex:none}
.stripes i{display:block}
.plate h1{margin:0;padding:.07em .2em .02em .17em;font-weight:900;font-stretch:62%;font-size:clamp(50px,8vw,96px);line-height:.86;text-transform:uppercase;letter-spacing:.004em}
.tag{margin:0;max-width:62ch;font-size:clamp(17px,2vw,20px);line-height:1.4;font-weight:520;text-wrap:balance}
.tag .m{color:var(--mute);font-weight:420}

.toggle{display:flex;padding:3px;gap:2px;background:var(--card);border:1px solid var(--rule);border-radius:999px;flex:none}
.toggle button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mute)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:899px){.toggle{display:none}}

/* ---------- Stage ---------- */
.stage{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1120px){.stage{grid-template-columns:minmax(0,1fr) 350px}}
.mapwrap{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden;min-width:0}
#map{display:block;width:100%;height:auto}
.key{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 16px;border-top:1px solid var(--rule)}
.lgs{display:flex;flex-wrap:wrap;gap:8px}
.lg{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);font-weight:600;font-size:14px}
.lg i{width:18px;height:18px;border-radius:50%;background:var(--c)}
.lg b{font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.lg:hover{border-color:var(--c)}
.lg[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on)}
.lg[aria-pressed="true"] b{color:inherit;opacity:.8}
.lg[aria-pressed="true"] i{background:var(--on)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{display:block;overflow:visible}

/* ---------- Map drawing ---------- */
.zone-line{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:3 7}
.zone-t{font-size:17px;fill:var(--mute);font-weight:420}
.rail{fill:none;stroke:var(--c);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s}
.rail.dim{opacity:.16}
.lk{transition:opacity .3s}
.lk.dim{opacity:.2}
.st{outline:none;cursor:pointer;transition:opacity .3s}
.st.dim{opacity:.2}
.hit{fill:transparent;stroke:transparent}
.mk{fill:var(--card);stroke:var(--ink);stroke-width:4.5;transition:fill .2s,transform .2s var(--ease);transform-box:fill-box;transform-origin:center}
.ring{fill:var(--card);stroke:var(--ink);stroke-width:5;transition:fill .2s,transform .2s var(--ease);transform-box:fill-box;transform-origin:center}
.cap-o{stroke:var(--ink);stroke-linecap:round;fill:none}
.cap-i{stroke:var(--card);stroke-linecap:round;fill:none;transition:stroke .2s}
.st:hover .mk,.st:hover .ring{transform:scale(1.18)}
.st.sel .mk,.st.sel .ring{fill:var(--c)}
.st.sel .cap-i{stroke:var(--c)}
.halo{fill:none;stroke:var(--c);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.st.sel .halo{animation:ping 1.1s var(--ease) 2}
@keyframes ping{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.9)}}
.fring{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:4 4;opacity:0}
.st:focus-visible .fring{opacity:1}
.lbl{font-size:20px;font-weight:650;font-stretch:88%;fill:var(--ink);stroke:var(--card);stroke-width:6px;stroke-linejoin:round;paint-order:stroke}
.lbl .sub{font-size:15px;font-weight:420;font-stretch:100%;fill:var(--mute)}
.lbl.big{font-size:23px;font-weight:800;font-stretch:80%}
.st:hover .lbl,.st.sel .lbl{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--c)}
.st.term .cap-o{stroke-width:34}
.st.term .cap-i{stroke-width:22}
#train circle:first-child{fill:var(--ink);stroke:var(--card);stroke-width:3}
#train circle:last-child{fill:var(--c)}

/* intro: lines draw in, stops appear behind them */
.intro .rail{stroke-dasharray:1 1;animation:draw 1.25s var(--ease) both;animation-delay:var(--d,0s)}
.intro .st,.intro .lk{animation:appear .45s ease both;animation-delay:var(--d,0s)}
.intro .zone,.intro .zone-line{animation:appear .8s ease both .1s}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes appear{from{opacity:0}}

/* ---------- Board ---------- */
.board{--c:var(--ink);position:relative;background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden;padding:26px 22px 22px;min-width:0}
.board::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:var(--c);transition:background .3s}
@media (min-width:1120px){.board{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}}
@media (min-width:900px) and (max-width:1119px){.board.has-sel{position:sticky;bottom:12px;max-height:44vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.18);padding-top:22px}.board.has-sel .b-name{font-size:36px}.board.has-sel .b-body{font-size:15px}}
.b-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;min-height:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--c);background:var(--c);color:var(--on);padding:3px 12px;border-radius:999px;font-weight:700;font-size:14px;font-stretch:90%}
.chip.plain{cursor:default}
button.chip{background:none;color:var(--ink)}
button.chip:hover{background:var(--soft)}
button.chip[aria-pressed="true"]{background:var(--c);color:var(--on)}
.linkbtn{white-space:nowrap;flex:none;border:0;background:none;padding:4px 2px;font-size:14px;font-weight:600;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.b-meta{margin:0;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.b-name{margin:2px 0 6px;font-weight:800;font-stretch:68%;font-size:clamp(38px,5.4vw,50px);line-height:.96;text-wrap:balance;overflow-wrap:anywhere}
.b-title{margin:0 0 4px;font-size:18px;font-weight:620;line-height:1.3}
.b-where{margin:0 0 12px;font-size:14px;color:var(--mute)}
.b-title+.b-body{margin-top:10px}
.b-body{margin:0 0 14px;max-width:62ch}
.pts{list-style:none;margin:0 0 16px;padding:0}
.pts li{position:relative;padding:0 0 12px 24px}
.pts li::before{content:"";position:absolute;left:0;top:.42em;width:12px;height:12px;border-radius:50%;background:var(--card);border:3.5px solid var(--c)}
.pts li::after{content:"";position:absolute;left:5px;top:calc(.42em + 12px);bottom:0;width:2px;background:var(--c);opacity:.5}
.pts li:last-child{padding-bottom:0}
.pts li:last-child::after{display:none}
.ctas{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.xfer{margin:0 0 16px}
.xfer .k{margin:0 0 6px;font-size:13px;color:var(--mute)}
.xbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card)}
.xbtn:hover{border-color:var(--c);background:var(--soft)}
.xbtn i{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c)}
.xbtn span{min-width:0;font-size:14px;color:var(--mute);line-height:1.3}
.xbtn b{color:var(--ink);font-weight:650;font-size:15px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.nav button{text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;padding:10px 12px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card)}
.nav button:hover:not(:disabled){border-color:var(--c);background:var(--soft)}
.nav button:disabled{opacity:.5;cursor:default}
.nav .k{font-size:12px;color:var(--mute)}
.nav .v{font-weight:650;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.nav .nx{text-align:right;align-items:flex-end}
.cap{margin:10px 0 0;font-size:13px;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.who{display:flex;gap:14px;align-items:center;margin:0 0 14px}
.who>div{min-width:0}
.portrait{display:block;flex:none;width:92px;height:92px;border-radius:14px;object-fit:cover;background:#2b2a28}
.who .b-name{font-size:clamp(36px,5vw,44px);margin:0 0 4px}
.who .b-title{margin:0;font-size:16px}
dl.facts{margin:0 0 16px;display:grid;gap:10px}
dl.facts div{display:grid;gap:0}
dl.facts dt{font-size:13px;color:var(--mute)}
dl.facts dd{margin:0;font-weight:560}
.contact{border-top:1px solid var(--rule);padding-top:14px;margin-top:4px}
.mailrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.mailrow .mail{flex:1 1 100%}
.mail{font-weight:700;font-size:17px;user-select:all;overflow-wrap:anywhere;font-stretch:92%}
.btn{display:inline-block;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:999px;font-weight:650;font-size:14px;text-decoration:none}
.btn.alt{background:none;color:var(--ink)}
.btn:hover{opacity:.88}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}
.links a{color:var(--ink);font-weight:600;text-underline-offset:3px}
.stoplist{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:2px}
.stoplist button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.stoplist button:hover{background:var(--soft)}
.stoplist .p{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.stoplist .n{font-weight:620}

/* ---------- Timetable (also the phone layout) ---------- */
.tt{display:none}
.tt-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));align-items:start}
.ln{--c:var(--l1);--on:var(--on1);background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px 16px 10px;min-width:0}
.ln-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:6px}
.ln-h .chip{font-size:17px;padding:4px 14px}
.ln-h p{margin:0;color:var(--mute);font-size:14px;flex:1 1 160px}
.rail-l{list-style:none;margin:8px 0 0;padding:0}
.stop{position:relative;padding-left:36px}
.stop::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:8px;background:var(--c)}
.stop:first-child::before{top:24px}
.stop:last-child::before{bottom:auto;height:24px}
.stop:only-child::before{display:none}
.dot{position:absolute;left:6px;top:13px;width:20px;height:20px;border-radius:50%;background:var(--card);border:4.5px solid var(--ink);transition:background .2s}
.dot.ix{left:4px;top:11px;width:24px;height:24px;border-width:5px}
.stop.open .dot{background:var(--c)}
.stop-btn{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 8px 10px 4px;border-radius:8px;min-height:46px}
.stop-btn:hover{background:var(--soft)}
.stop-btn:focus-visible{outline-offset:-2px}
.sn{font-weight:650;font-size:17px;font-stretch:92%}
.sp{margin-left:8px;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.also{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px;font-size:13px;color:var(--mute)}
.also span{display:inline-flex;align-items:center;gap:5px}
.also i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sd{padding:4px 4px 16px 4px}
.sd .b-title{margin-top:2px}
.ln.about{--c:var(--ink);--on:var(--bg)}
.ln.about .portrait{width:84px;height:84px}
.ln.about .b-name{font-size:38px}
.ln.about .b-body{margin-top:2px}
.ln.term{--c:var(--ink);--on:var(--bg);position:relative;overflow:hidden;padding-top:26px}
.ln.term::before,.ln.about::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:var(--grad)}
.ln.about{position:relative;overflow:hidden;padding-top:26px}
@media (max-width:899px){.mapwrap,.board,.toggle{display:none}.tt{display:block}}
[data-view="list"] .mapwrap,[data-view="list"] .board{display:none}
[data-view="list"] .tt{display:block}
[data-view="list"] .stage{grid-template-columns:minmax(0,1fr)}

.foot{margin:24px 0 0;font-size:13px;color:var(--mute);max-width:80ch}

dialog{padding:0;border:0;border-radius:14px;background:var(--card);color:var(--ink);width:min(920px,calc(100vw - 32px));overflow:hidden}
dialog::backdrop{background:rgba(5,10,15,.72)}
dialog video{display:block;width:100%;max-height:72vh;background:#000}
.dlg-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;font-size:14px}
.dlg-bar span{min-width:0;color:var(--mute)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

          <span><svg width="22" height="30" viewBox="0 0 22 30" style="margin-block:-4px"><line class="cap-o" x1="11" y1="9" x2="11" y2="21" style="stroke-width:18"/><line class="cap-i" x1="11" y1="9" x2="11" y2="21" style="stroke-width:10"/></svg>Terminus</span>
        </div>

  <div class="sr" id="live" aria-live="polite"></div>
</div>

<noscript><section class="main" style="max-width:760px;margin:0 auto;padding:24px 16px"><p class="foot" style="margin:0 0 20px">The career map needs JavaScript. Everything on it is listed below. You can also reach Prateek at <a href="mailto:prateekmadnani01@gmail.com">prateekmadnani01@gmail.com</a> or on <a href="https://www.linkedin.com/in/prateek-madnani/">LinkedIn</a>.</p><h2 style="font:700 22px/1.2 system-ui,sans-serif;margin:28px 0 10px">Roles</h2><ul style="padding-left:18px;margin:0"><li style="margin:0 0 12px"><strong>Senior Technical Product Manager, AgingOptions</strong> <span style="color:#4a586a">(Jul 2026 – Present)</span><br>Leading the move of a legacy legal-tech platform to a scalable, cloud-native product, with one roadmap across engineering, QA, DevOps, UX and the business.</li><li style="margin:0 0 12px"><strong>Senior Consultant, American Arbitration Association</strong> <span style="color:#4a586a">(Jul 2025 – Jun 2026)</span><br>Technical product manager for the Resolution Simulator, a multi-agent GenAI platform that gives a baseline evaluation of a legal claim without an arbitrator. Also owned payments, notifications and microservices work.</li><li style="margin:0 0 12px"><strong>AI Product Engineer (internship), Dentite</strong> <span style="color:#4a586a">(Jan – Jun 2025)</span><br>Defined the roadmap for automating dental-to-medical insurance claims on a platform that handles over $1M in claims a month, and launched a HIPAA-compliant data protection platform.</li><li style="margin:0 0 12px"><strong>Product Analyst (internship), University at Buffalo School of Management</strong> <span style="color:#4a586a">(Jul – Dec 2024)</span><br>Worked with enterprise real estate clients on business process re-engineering, turning operational problems into prioritized backlogs, roadmaps and functional specs for property leasing and management software.</li><li style="margin:0 0 12px"><strong>Information Technology Consultant, Blackhawk Network</strong> const rails = {};
LINES.forEach((l, i) => {
  const p = S("path", { class: "rail", d: roundedPath(l.path.map(P), 32), pathLength: 1, style: `--c:var(${l.color});--d:${(i * 0.12).toFixed(2)}s` }, gRails);
  p.dataset.line = l.id;
  rails[l.id] = p;
});

// arc length on a rail nearest to a point
function nearest(path, pt) {
  const total = path.getTotalLength(); let best = { len: 0, dist: Infinity };
  for (let s = 0; s <= total; s += 2) {
    const q = path.getPointAtLength(s), dd = Math.hypot(q.x - pt[0], q.y - pt[1]);
    if (dd < best.dist) best = { len: s, dist: dd };
  }
  return best;
}

STATIONS.forEach(st => {
  st.pts = st.at.map(P);
  st.kind = st.at.length > 1 ? (st.terminus ? "term" : "cap") : (st.lines.length > 1 ? "ring" : "stop");
  st.len = {};
  st.lines.forEach(id => {
    let best = { dist: Infinity };
    st.pts.forEach(pt => { const n = nearest(rails[id], pt); if (n.dist < best.dist) best = n; });
    st.len[id] = best.len;
    if (best.dist > 6 && st.pts.length === 1) console.warn(`Stop "${st.id}" is ${Math.round(best.dist)}px off the ${id} line. Check its "at" point.`);
  });
});

// interchanges between linked stops
const gLinks = S("g", {}, svg);
const linkEls = [];
LINKS.forEach(([a, b]) => {
  const A = BY[a], B = BY[b]; if (!A || !B) return;
  A.partner = b; B.partner = a;
  const g = S("g", { class: "lk", style: `--d:${(0.3 + (A.pts[0][0] - OX) / U / 11).toFixed(2)}s` }, gLinks);
  S("line", { class: "cap-o", x1: A.pts[0][0], y1: A.pts[0][1], x2: B.pts[0][0], y2: B.pts[0][1], "stroke-width": 30 }, g);
  S("line", { class: "cap-i", x1: A.pts[0][0], y1: A.pts[0][1], x2: B.pts[0][0], y2: B.pts[0][1], "stroke-width": 20 }, g);
  linkEls.push({ el: g, lines: [A.lines[0], B.lines[0]] });
});

// train (rides between stops)
const train = S("g", { id: "train", style: "display:none", "pointer-events": "none" }, svg);
S("circle", { r: 10 }, train); S("circle", { r: 4 }, train);

// stations
const gSt = S("g", {}, svg);
const stEls = {};
const OFF = { stop: 10, ring: 14, cap: 15, term: 18 };
STATIONS.forEach(st => {
  const cx = st.pts.reduce((a, p) => a + p[0], 0) / st.pts.length;
  const cy = st.pts.reduce((a, p) => a + p[1], 0) / st.pts.length;
  const top = Math.min(...st.pts.map(p => p[1])), bot = Math.max(...st.pts.map(p => p[1]));
  const r = OFF[st.kind];

  const g = S("g", { class: "st" + (st.terminus ? " term" : ""), tabindex: 0, role: "button", "data-id": st.id,
    "aria-label": `${st.name}. ${st.lines.length > 1 ? "All lines" : LBY[st.lines[0]].name + " line"}.${st.period ? " " + st.period + "." : ""}`,
    style: `--d:${(0.3 + (st.pts[0][0] - OX) / U / 11).toFixed(2)}s` }, gSt);
  if (st.pts.length > 1) {
    const a = st.pts[0], b = st.pts[st.pts.length - 1];
    S("line", { class: "hit", x1: a[0], y1: a[1], x2: b[0], y2: b[1], "stroke-width": 44, "stroke-linecap": "round" }, g);
    S("line", { class: "cap-o", x1: a[0], y1: a[1], x2: b[0], y2: b[1], "stroke-width": 30 }, g);
    S("line", { class: "cap-i", x1: a[0], y1: a[1], x2: b[0], y2: b[1], "stroke-width": 20 }, g);
    S("rect", { class: "fring", x: Math.min(a[0], b[0]) - 24, y: Math.min(a[1], b[1]) - 24, width: Math.abs(b[0] - a[0]) + 48, height: Math.abs(b[1] - a[1]) + 48, rx: 24 }, g);
    S("rect", { class: "halo", x: Math.min(a[0], b[0]) - 17, y: Math.min(a[1], b[1]) - 17, width: Math.abs(b[0] - a[0]) + 34, height: Math.abs(b[1] - a[1]) + 34, rx: 17 }, g);
  } else {
    const [x, y] = st.pts[0];
    S("circle", { class: "hit", cx: x, cy: y, r: 24 }, g);
    S("circle", { class: "halo", cx: x, cy: y, r: r + 5 }, g);
    S("circle", { class: st.kind === "ring" ? "ring" : "mk", cx: x, cy: y, r: st.kind === "ring" ? 13 : 9.5 }, g);
    S("circle", { class: "fring", cx: x, cy: y, r: r + 13 }, g);
  }
  // label: one or more rows, anchored by side
  const rows = (st.lbl || st.name).split("\n"); if (st.sub) rows.push(st.sub);
  const n = rows.length, L = st.label || "n", t = S("text", { class: "lbl" + (st.terminus ? " big" : "") }, g);
  const pos = {
    n:  [cx, top - r - 14, "middle"],  s:  [cx, bot + r + 28, "middle"],
    ne: [cx + r + 6, top - r - 8, "start"], nw: [cx - r - 6, top - r - 8, "end"],
    se: [cx + r + 6, bot + r + 24, "start"], sw: [cx - r - 6, bot + r + 24, "end"],
    e:  [cx + r + 14, cy + 7, "start"], w:  [cx - r - 14, cy + 7, "end"]
  }[L];
  const up = (L === "n" || L === "ne" || L === "nw") ? (n - 1) * LH : (L === "e" || L === "w") ? (n - 1) * LH / 2 : 0;
  t.setAttribute("x", pos[0]); t.setAttribute("y", pos[1] - up); t.setAttribute("text-anchor", pos[2]);
  rows.forEach((txt, i) => {
    const ts = S("tspan", { x: pos[0], dy: i === 0 ? 0 : (st.sub && i === n - 1 ? 24 : LH) }, t);
    if (st.sub && i === n - 1) ts.setAttribute("class", "sub");
    ts.textContent = txt;
  });
  stEls[st.id] = g;
});

// order of stops along each line
const order = {};
LINES.forEach(l => { order[l.id] = STATIONS.filter(s => s.lines.includes(l.id)).sort((a, b) => a.len[l.id] - b.len[l.id]); });
const count = id => order[id].filter(s => !s.terminus).length;

/* ---------- legend (line buttons) ---------- */
$("#lgs").innerHTML = LINES.map(l => `<button type="button" class="lg" data-act="line" data-line="${l.id}" aria-pressed="false" style="--c:${colorOf(l.id)};--on:${onOf(l.id)}"><i></i>${esc(l.name)} <b>${count(l.id)}</b></button>`).join("");

/* ---------- content builders ---------- */
const effLine = () => cur || (sel ? BY[sel].lines[0] : null);
const lineStyle = id => `style="--c:${colorOf(id)};--on:${onOf(id)}"`;
const portrait = () => `<img class="portrait" src="${esc(PERSON.photo)}" alt="${esc(PERSON.photoAlt)}" width="92" height="92" decoding="async">`;

function contactHTML() {
  const links = PERSON.links.map(([n, h]) => `<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(n)}</a>`).join("");
  return `<div class="contact">
    <p class="mailrow"><span class="mail">${esc(PERSON.email)}</span> <button type="button" class="btn" data-act="copy">Copy</button> <a class="btn alt" href="mailto:${esc(PERSON.email)}">Email</a></p>
    <div class="links">${links}</div></div>`;
}

function ctaHTML(st) {
  const out = (st.cta || []).map(([label, href]) => {
    const ext = /^https?:/.test(href);
    return `<a class="btn" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ""}>${esc(label)}</a>`;
  });
  if (st.video) out.push(`<button type="button" class="btn alt" data-act="video">Watch the video</button>`);
  return out.length ? `<div class="ctas">${out.join("")}</div>` : "";
}

function xferHTML(st) {
  if (!st.partner) return "";
  const pt = BY[st.partner], pl = pt.lines[0];
  return `<div class="xfer"><p class="k">Change here</p><button type="button" class="xbtn" data-act="select" data-id="${pt.id}" data-line="${pl}" style="--c:${colorOf(pl)}"><i></i><span><b>${esc(LBY[pl].name)} line</b><br>${esc(pt.name)}</span></button></div>`;
}

function pointsHTML(st) {
  return st.points && st.points.length ? `<ul class="pts">${st.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : "";
}

function detailHTML(st, nav) {
  if (!nav) {
    return `<p class="b-title">${esc(st.title || "")}</p>${st.where ? `<p class="b-where">${esc(st.where)}</p>` : ""}<p class="b-body">${esc(st.body || "")}</p>${pointsHTML(st)}${ctaHTML(st)}${xferHTML(st)}`;
  }
  const L = effLine(), multi = st.lines.length > 1;
  const chips = st.lines.map(id => multi
    ? `<button type="button" class="chip" data-act="ride" data-line="${id}" aria-pressed="${L === id}" ${lineStyle(id)}>${esc(LBY[id].name)}</button>`
    : `<span class="chip plain" ${lineStyle(id)}>${esc(LBY[id].name)} line</span>`).join("");
  let h = `<div class="b-head"><div class="chips">${chips}</div><button type="button" class="linkbtn" data-act="home">Whole network</button></div>`;
  h += `${st.period ? `<p class="b-meta">${esc(st.period)}</p>` : ""}<h2 class="b-name" id="b-name" tabindex="-1">${esc(st.name)}</h2><p class="b-title">${esc(st.title || "")}</p>${st.where ? `<p class="b-where">${esc(st.where)}</p>` : ""}<p class="b-body">${esc(st.body || "")}</p>`;
  h += pointsHTML(st) + ctaHTML(st) + xferHTML(st);
  if (st.contact) h += contactHTML();
  const list = order[L], i = list.indexOf(st);
  const prev = i > 0 ? list[i - 1] : null, next = i >= 0 && i < list.length - 1 ? list[i + 1] : null;
  h += `<div class="nav"><button type="button" data-act="prev" ${prev ? "" : "disabled"}><span class="k">Previous stop</span><span class="v">${esc(prev ? prev.name : "Start of the line")}</span></button>
    <button type="button" class="nx" data-act="next" ${next ? "" : "disabled"}><span class="k">Next stop</span><span class="v">${esc(next ? next.name : "End of the line")}</span></button></div>`;
  h += `<p class="cap">Stop ${i + 1} of ${list.length} on the ${esc(LBY[L].name)} line${multi ? ". Use the chips above to change line." : ""}</p>`;
  return h;
}

function whoHTML() {
  return `<div class="who">${portrait()}<div><h2 class="b-name" id="b-name" tabindex="-1">${esc(PERSON.introTitle)}</h2><p class="b-title">${esc(PERSON.role)}</p></div></div>`;
}
function factsHTML() { return `<dl class="facts">${PERSON.facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`; }

function overviewHTML() {
  return `<div class="b-head"><span class="b-meta">You are here</span></div>${whoHTML()}<p class="b-body">${esc(PERSON.intro)}</p>${factsHTML()}${contactHTML()}`;
}

function lineCardHTML(id) {
  const l = LBY[id];
  return `<div class="b-head"><div class="chips"><span class="chip plain" ${lineStyle(id)}>${esc(l.name)} line</span></div><button type="button" class="linkbtn" data-act="home">Whole network</button></div>
    <p class="b-meta">${count(id)} stops</p><h2 class="b-name" id="b-name" tabindex="-1">${esc(l.name)}</h2><p class="b-title">${esc(l.sub)}</p>
    <ul class="stoplist">${order[id].map(s => `<li><button type="button" data-act="select" data-id="${s.id}" data-line="${id}"><span class="n">${esc(s.name)}</span><span class="p">${esc(s.period || "")}</span></button></li>`).join("")}</ul>`;
}

/* ---------- timetable ---------- */
function buildTimetable() {
  const about = `<section class="ln about"><div class="who">${portrait().replace('width="92" height="92"', 'width="84" height="84"')}<div><h2 class="b-name">${esc(PERSON.introTitle)}</h2><p class="b-title">${esc(PERSON.role)}</p></div></div><p class="b-body">${esc(PERSON.intro)}</p>${factsHTML()}</section>`;
  const cards = LINES.map(l => {
    const stops = order[l.id].filter(s => !s.terminus).map(s => {
      const pt = s.partner ? BY[s.partner] : null;
      const also = pt ? `<span class="also"><span style="--c:${colorOf(pt.lines[0])}"><i></i>Change for ${esc(LBY[pt.lines[0]].name)}: ${esc(pt.name)}</span></span>` : "";
      return `<li class="stop" data-id="${s.id}" data-line="${l.id}"><button type="button" class="stop-btn" data-act="toggle" data-id="${s.id}" data-line="${l.id}" aria-expanded="false"><span class="dot${pt ? " ix" : ""}"></span><span class="sn">${esc(s.name)}</span>${s.period ? `<span class="sp">${esc(s.period)}</span>` : ""}${also}</button><div class="sd" hidden></div></li>`;
    }).join("");
    return `<section class="ln" data-line="${l.id}" ${lineStyle(l.id)}><div class="ln-h"><span class="chip plain">${esc(l.name)}</span><p>${esc(l.sub)}</p></div><ol class="rail-l">${stops}</ol></section>`;
  }).join("");
  const T = STATIONS.find(s => s.terminus);
  const term = T ? `<section class="ln term"><div class="ln-h"><span class="chip plain">Terminus</span><p>All five lines end here</p></div><h2 class="b-name" style="font-size:44px;margin-top:6px">${esc(T.name)}</h2><p class="b-title">${esc(T.title)}</p><p class="b-body" style="margin-top:8px">${esc(T.body)}</p>${contactHTML()}<div style="height:8px"></div></section>` : "";
  tt.innerHTML = `<div class="tt-grid">${about}${cards}${term}</div>`;
}
buildTimetable();

/* ---------- render ---------- */
function render(opts = {}) {
  const L = effLine();
  const active = cur ? [cur] : sel ? BY[sel].lines : null;
  for (const id in rails) rails[id].classList.toggle("dim", !!active && !active.includes(id));
  linkEls.forEach(k => k.el.classList.toggle("dim", !!active && !k.lines.some(x => active.includes(x))));
  STATIONS.forEach(st => {
    const g = stEls[st.id];
    g.classList.toggle("dim", !!active && !st.lines.some(x => active.includes(x)));
    g.classList.toggle("sel", st.id === sel);
    g.setAttribute("aria-pressed", String(st.id === sel));
  });
  const accent = L ? colorOf(L) : "var(--ink)";
  svg.style.setProperty("--c", accent);
  board.style.setProperty("--c", accent);
  board.style.setProperty("--on", L ? onOf(L) : "var(--bg)");
  board.classList.toggle("has-sel", !!(sel || cur));
  board.innerHTML = sel ? detailHTML(BY[sel], true) : cur ? lineCardHTML(cur) : overviewHTML();
  document.querySelectorAll(".lg").forEach(b => b.setAttribute("aria-pressed", String(!sel && cur === b.dataset.line)));

  const openLine = sel ? (L || BY[sel].lines[0]) : null;
  tt.querySelectorAll(".stop").forEach(li => {
    const open = li.dataset.id === sel && li.dataset.line === openLine;
    li.classList.toggle("open", open);
    const sd = li.querySelector(".sd"), btn = li.querySelector(".stop-btn");
    btn.setAttribute("aria-expanded", String(open));
    sd.hidden = !open;
    if (open) sd.innerHTML = detailHTML(BY[sel], false);
    else if (sd.innerHTML) sd.innerHTML = "";
  });
  live.textContent = sel ? `${BY[sel].name}. ${BY[sel].title || ""}` : cur ? `${LBY[cur].name} line` : "Whole network";
  if (opts.focus) { const f = $(opts.focus, board); (f && !f.disabled ? f : $("#b-name", board))?.focus({ preventScroll: true }); }
}

/* ---------- state changes ---------- */
function setHash(id) {
  try { history.replaceState(null, "", id ? "#" + id : location.pathname + location.search); } catch (e) {}
}
function stopAnim() { if (anim) cancelAnimationFrame(anim); anim = null; train.style.display = "none"; }
function select(id, { line, focus } = {}) {
  stopAnim();
  const st = BY[id]; if (!st) return;
  sel = id;
  if (line) cur = line; else if (!(cur && st.lines.includes(cur))) cur = null;
  setHash(id); render({ focus });
}
function home() { stopAnim(); sel = null; cur = null; setHash(null); render(); }
function focusLine(id) { stopAnim(); if (!sel && cur === id) { cur = null; } else { sel = null; cur = id; } setHash(null); render(); }
function ride(line, a, b, done) {
  stopAnim();
  const path = rails[line], la = a.len[line], lb = b.len[line];
  if (reduce.matches || svg.getBoundingClientRect().width === 0) { done(); return; }
  const dur = Math.min(950, Math.max(380, Math.abs(lb - la) * 1.5));
  train.style.display = ""; svg.style.setProperty("--c", colorOf(line));
  const t0 = performance.now();
  const frame = now => {
    const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const p = path.getPointAtLength(la + (lb - la) * e);
    train.setAttribute("transform", `translate(${p.x} ${p.y})`);
    if (k < 1) anim = requestAnimationFrame(frame); else { anim = null; train.style.display = "none"; done(); }
  };
  anim = requestAnimationFrame(frame);
}
function step(dir, how) {
  const L = effLine(); if (!sel || !L) return;
  const list = order[L], i = list.indexOf(BY[sel]), target = list[i + dir];
  if (!target) return;
  cur = L; render();
  ride(L, BY[sel], target, () => {
    select(target.id, { line: L, focus: how === "key" ? null : (dir > 0 ? '[data-act="next"]' : '[data-act="prev"]') });
    if (how === "key") stEls[target.id].focus({ preventScroll: true });
  });
}

/* ---------- events ---------- */
async function copyMail(btn) {
  const say = m => { const o = btn.textContent; btn.textContent = m; setTimeout(() => btn.textContent = o, 1600); };
  try { await navigator.clipboard.writeText(PERSON.email); say("Copied"); }
  catch (e) {
    const el = btn.parentElement.querySelector(".mail"), r = document.createRange(); r.selectNodeContents(el);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); say("Press Ctrl/⌘ C");
  }
}
const dlg = $("#vdlg"), vid = $("#vid");
$("#vclose").addEventListener("click", () => dlg.close());
dlg.addEventListener("close", () => vid.pause());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

document.addEventListener("click", e => {
  const stg = e.target.closest(".st");
  if (stg) { select(stg.dataset.id); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "view") {
    app.dataset.view = b.dataset.view;
    document.querySelectorAll(".toggle button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }
  else if (act === "line") focusLine(b.dataset.line);
  else if (act === "ride") { cur = b.dataset.line; render({ focus: `[data-act="ride"][data-line="${b.dataset.line}"]` }); }
  else if (act === "select") select(b.dataset.id, { line: b.dataset.line, focus: app.dataset.view === "list" || getComputedStyle(board).display === "none" ? null : "#b-name" });
  else if (act === "toggle") { if (sel === b.dataset.id && (effLine() || BY[sel].lines[0]) === b.dataset.line) home(); else { sel = null; select(b.dataset.id, { line: b.dataset.line }); const li = b.closest(".stop"); setTimeout(() => li.scrollIntoView({ block: "nearest", behavior: reduce.matches ? "auto" : "smooth" }), 30); } }
  else if (act === "prev") step(-1, "btn");
  else if (act === "next") step(1, "btn");
  else if (act === "home") home();
  else if (act === "copy") copyMail(b);
  else if (act === "video") { try { dlg.showModal(); vid.play().catch(() => {}); } catch (err) { window.location.href = "in-n-out-case-study.html"; } }
});
document.addEventListener("keydown", e => {
  const stg = e.target.closest && e.target.closest(".st");
  if (stg && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(stg.dataset.id); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || dlg.open) return;
  if (e.key === "Escape" && (sel || cur)) { home(); return; }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && sel && e.target.closest && e.target.closest(".st, .board, .key")) {
    e.preventDefault(); step(e.key === "ArrowRight" ? 1 : -1, "key");
  }
});

/* ---------- start ---------- */
render();
app.classList.add("intro");
setTimeout(() => app.classList.remove("intro"), 2600);
const h = decodeURIComponent((location.hash || "").slice(1));
if (BY[h]) select(h);
addEventListener("hashchange", () => { const k = decodeURIComponent((location.hash || "").slice(1)); if (BY[k]) select(k); else if (!k) home(); });
})();
</script>
</body>
</html>
